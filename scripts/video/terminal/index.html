<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tomato server · Claude Code session</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --bar: #161c24;
        --line: #232c38;
        --ink: #d1d5db;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", "Courier New", monospace;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 0 0 auto;
        padding: 8px 14px;
        background: var(--bar);
        border-bottom: 1px solid var(--line);
        font-size: 15px;
        color: #9aa6b5;
      }
      header .dots { display: flex; gap: 6px; }
      header .dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
      /* Les trois pastilles d'une fenêtre de terminal : elles disent « ceci est une console ». */
      header .dots i:nth-child(1) { background: #ff5f57; }
      header .dots i:nth-child(2) { background: #febc2e; }
      header .dots i:nth-child(3) { background: #28c840; }
      main {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        padding: 10px 14px 14px;
      }
      #out {
        margin: 0;
        font-size: 18px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #out div { padding: 1px 0; }
      /* Curseur de saisie, qui clignote comme celui d'un vrai terminal : la vidéo doit voir qu'il vit. */
      #cursor {
        display: inline-block;
        width: 9px;
        height: 1em;
        vertical-align: text-bottom;
        background: #4ade80;
        animation: blink 1.1s steps(1, end) infinite;
      }
      @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    </style>
  </head>
  <body>
    <header>
      <span class="dots"><i></i><i></i><i></i></span>
      <span>Tomato server · Claude Code session</span>
    </header>
    <main><pre id="out"><div id="cursorLine"><span id="cursor"></span></div></pre></main>
    <script>
      // La page n'invente rien : elle affiche, ligne à ligne, le fichier que le serveur écrit avec
      // TOMATO_LOG_FILE. Le HTML coloré est produit côté Node (lib/ansi.ts), qui est testé ; ici on
      // ne fait que le coller et faire défiler.
      (function () {
        var out = document.getElementById('out');
        var cursorLine = document.getElementById('cursorLine');
        var main = document.querySelector('main');
        var from = 0;
        var polling = false;

        function append(html) {
          var row = document.createElement('div');
          row.innerHTML = html === '' ? '&nbsp;' : html;
          out.insertBefore(row, cursorLine);
        }

        function trim() {
          // Une prise dure deux minutes : quelques centaines de lignes suffisent, et le DOM reste léger.
          while (out.childElementCount > 400) out.removeChild(out.firstElementChild);
        }

        function poll() {
          if (polling) return;
          polling = true;
          fetch('/lines?from=' + from)
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data.next < from) from = 0;
              for (var i = 0; i < data.lines.length; i += 1) append(data.lines[i]);
              from = data.next;
              trim();
              main.scrollTop = main.scrollHeight;
              document.body.dataset.lines = String(from);
            })
            .catch(function () { /* le serveur de prise s'est arrêté : on garde ce qui est à l'écran */ })
            .then(function () { polling = false; });
        }

        poll();
        setInterval(poll, 100);
      })();
    </script>
  </body>
</html>
